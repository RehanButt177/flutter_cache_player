group 'com.lazyarts.vikram.cached_video_player'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Required by Android Gradle Plugin 8+. Safe on the AGP 7.3 line used by
    // Flutter 3.10.
    namespace 'com.lazyarts.vikram.cached_video_player'

    // Follow the Flutter SDK that is building the host app, instead of a
    // hardcoded API level that goes stale.
    compileSdkVersion flutter.compileSdkVersion

    compileOptions {
        // Java 11 source still compiles on the JDK 17 that current Flutter
        // requires, and on the JDK 11 toolchain used by Flutter 3.10.
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    defaultConfig {
        minSdkVersion flutter.minSdkVersion
    }

    lintOptions {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation 'com.google.android.exoplayer:exoplayer-core:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-hls:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-dash:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-smoothstreaming:2.19.1'
}
