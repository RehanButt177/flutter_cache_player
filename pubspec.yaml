name: flutter_cache_player
description: A new flutter plugin that is virtually a clone of official video_player and cached_video_player plugin except that it supports caching( Android and iOS)
version: 1.0.4
homepage: https://github.com/RehanButt177/flutter_cache_player

flutter:
  plugin:
    platforms:
      android:
        package: com.lazyarts.vikram.cached_video_player
        pluginClass: CachedVideoPlayerPlugin
      ios:
        pluginClass: CachedVideoPlayerPlugin
      web:
        default_package: video_player_web
        fileName: lib/cached_video_player_web.dart

dependencies:
  meta: ^1.7.0
  # 6.2.2 is the first 6.x release that allows Dart 3. 6.9.x still exposes the
  # types this plugin calls. Pub picks the newest release the app's SDK allows.
  video_player_platform_interface: ">=6.2.2 <7.0.0"
  # 2.0.17 still resolves on Flutter 3.10. Newer 2.x releases resolve on
  # current Flutter and keep the same registerWith entry point.
  video_player_web: ">=2.0.17 <3.0.0"

  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Wide range so `flutter pub get` works from Dart 3.0 through Dart 3.13.
  lints: ">=3.0.0 <7.0.0"
  pigeon: ">=14.0.0 <17.0.0"

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

